<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnesthAssist · GA Decision Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f0f4f8; --surface:#ffffff; --surface2:#f7f9fb; --surface3:#edf1f5;
      --border:#dde3ea; --border-hi:#c5cdd8; --text:#1a202c; --muted:#64748b; --dim:#94a3b8;
      --accent:#0284c7; --accent-dim:rgba(2,132,199,.08); --accent-b:rgba(2,132,199,.25);
      --danger:#dc2626; --danger-dim:rgba(220,38,38,.07); --danger-b:rgba(220,38,38,.25);
      --success:#16a34a; --success-dim:rgba(22,163,74,.07); --success-b:rgba(22,163,74,.25);
      --warn:#d97706; --warn-dim:rgba(217,119,6,.07); --warn-b:rgba(217,119,6,.25);
    }
    html { scroll-behavior:smooth; }
    body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}

    /* Header */
    .hdr { position:sticky; top:0; z-index:200; border-bottom:1px solid var(--border); height:58px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.95); backdrop-filter:blur(12px); box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .hdr-brand { display:flex; align-items:center; gap:10px; }
    .hdr-logo { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:.75rem; color:#fff; }
    .hdr-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; color:var(--text); }
    .hdr-badge { font-family:'IBM Plex Mono',monospace; font-size:.62rem; padding:3px 9px; background:var(--accent-dim); border:1px solid var(--accent-b); border-radius:5px; color:var(--accent); letter-spacing:.05em; }

    /* Layout */
    .layout { display:grid; grid-template-columns:210px 1fr 490px; height:calc(100vh - 58px); }
    @media(max-width:1100px){ .layout{ grid-template-columns:190px 1fr 420px; } }
    @media(max-width:800px){ .layout{ grid-template-columns:1fr; height:auto; } .col-history{ display:none; } }

    /* Left */
    .col-history { border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; background:var(--surface); }
    .hist-head { padding:16px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--surface2); }
    .hist-head-title { font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem; color:var(--text); margin-bottom:2px; }
    .hist-head-sub { font-family:'IBM Plex Mono',monospace; font-size:.63rem; color:var(--muted); }
    .hist-search { margin-top:10px; }
    .hist-search input { width:100%; padding:7px 10px; background:var(--surface); border:1px solid var(--border); border-radius:7px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.75rem; }
    .hist-search input:focus { outline:none; border-color:var(--accent-b); box-shadow:0 0 0 3px var(--accent-dim); }
    .hist-search input::placeholder { color:var(--dim); }
    .hist-list { flex:1; overflow-y:auto; padding:8px; }
    .hist-item { padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; transition:all .15s; border:1px solid transparent; }
    .hist-item:hover { background:var(--surface2); border-color:var(--border); }
    .hist-item.active { background:var(--accent-dim); border-color:var(--accent-b); }
    .hist-pid { font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:500; color:var(--accent); margin-bottom:2px; }
    .hist-pname { font-size:.78rem; color:var(--text); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
    .hist-row { display:flex; align-items:center; justify-content:space-between; }
    .hist-vis { font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--muted); }
    .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot.ga { background:var(--danger); } .dot.ok { background:var(--success); }
    .hist-empty { padding:28px 12px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--dim); line-height:1.8; }

    /* Center */
    .col-form { overflow-y:auto; padding:28px 24px; background:var(--bg); }
    .slabel { font-family:'IBM Plex Mono',monospace; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .slabel::after { content:''; flex:1; height:1px; background:var(--border); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field label { font-family:'IBM Plex Mono',monospace; font-size:.63rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; }
    input[type=text], input[type=number], select { width:100%; padding:9px 12px; background:var(--surface); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:.88rem; appearance:none; transition:all .15s; }
    input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    input::placeholder { color:var(--dim); }
    .pid-row { display:flex; gap:8px; }
    .pid-row input { flex:1; }
    .btn-gen { padding:9px 12px; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; color:var(--muted); font-size:.75rem; cursor:pointer; white-space:nowrap; transition:all .15s; font-family:'IBM Plex Mono',monospace; }
    .btn-gen:hover { border-color:var(--accent-b); color:var(--accent); background:var(--accent-dim); }
    .chip-grid { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { padding:6px 13px; border:1.5px solid var(--border); border-radius:20px; font-size:.78rem; color:var(--muted); background:var(--surface); cursor:pointer; transition:all .15s; user-select:none; font-weight:500; }
    .chip:hover { border-color:var(--accent-b); color:var(--accent); }
    .chip.on { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
    .chip.on-yes { background:rgba(220,38,38,.07); border-color:rgba(220,38,38,.4); color:var(--danger); }

    /* Right */
    .col-result { border-left:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; padding:20px; background:var(--surface); gap:14px; }
    .warn-box { background:var(--warn-dim); border:1px solid var(--warn-b); border-radius:10px; padding:12px 14px; font-size:.75rem; color:var(--warn); line-height:1.6; flex-shrink:0; }
    .warn-box strong { color:var(--warn); }

    /* Result card */
    .result-card { border-radius:12px; border:1.5px solid; padding:18px; animation:fadeUp .3s ease; flex-shrink:0; }
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .result-card.ga    { background:var(--danger-dim);  border-color:var(--danger-b); }
    .result-card.no-ga { background:var(--success-dim); border-color:var(--success-b); }
    .r-icon { font-size:1.8rem; margin-bottom:8px; }
    .r-verdict { font-family:'Syne',sans-serif; font-weight:700; font-size:1.05rem; line-height:1.3; margin-bottom:4px; }
    .result-card.ga    .r-verdict { color:var(--danger); }
    .result-card.no-ga .r-verdict { color:var(--success); }
    .r-meta { font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--muted); margin-bottom:16px; line-height:1.6; }
    .prob-row { display:flex; flex-direction:column; gap:10px; }
    .prob-item { display:flex; flex-direction:column; gap:5px; }
    .prob-top { display:flex; justify-content:space-between; }
    .prob-name { font-family:'IBM Plex Mono',monospace; font-size:.63rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .prob-pct { font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:600; }
    .prob-pct.ga { color:var(--danger); } .prob-pct.ok { color:var(--success); }
    .bar-track { height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:3px; transition:width .6s cubic-bezier(.4,0,.2,1); }
    .bar-fill.ga-bar { background:var(--danger); } .bar-fill.ok-bar { background:var(--success); }

    /* Profile table */
    .profile-box { border:1px solid var(--border); border-radius:12px; overflow:hidden; flex-shrink:0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .profile-header { padding:14px 16px; background:var(--surface2); border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; }
    .profile-pid  { font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--accent); margin-bottom:2px; }
    .profile-name { font-family:'Syne',sans-serif; font-size:1rem; font-weight:700; color:var(--text); }
    .profile-badge { font-family:'IBM Plex Mono',monospace; font-size:.65rem; padding:3px 9px; background:var(--accent-dim); border:1px solid var(--accent-b); border-radius:4px; color:var(--accent); white-space:nowrap; }
    .profile-table-wrap { overflow-x:auto; max-height:380px; overflow-y:auto; }
    table { width:100%; border-collapse:collapse; font-size:.75rem; }
    thead { position:sticky; top:0; z-index:10; }
    thead tr { background:var(--surface2); }
    th { padding:9px 10px; text-align:left; font-family:'IBM Plex Mono',monospace; font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text); white-space:nowrap; vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:var(--surface2); }
    .td-date { font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--muted); }
    .td-decision.ga { color:var(--danger); font-weight:600; }
    .td-decision.ok { color:var(--success); font-weight:600; }
    .td-conf { font-family:'IBM Plex Mono',monospace; color:var(--muted); }
    .tag { display:inline-block; padding:2px 7px; border-radius:10px; font-size:.65rem; font-family:'IBM Plex Mono',monospace; font-weight:500; }
    .tag.yes { background:rgba(220,38,38,.1); color:var(--danger); }
    .tag.no  { background:var(--surface3); color:var(--muted); }
    .tag.beh { background:var(--accent-dim); color:var(--accent); margin:1px; border:1px solid var(--accent-b); }

    /* Idle */
    .idle-box { border:1.5px dashed var(--border); border-radius:12px; padding:32px 16px; text-align:center; flex-shrink:0; background:var(--surface2); }
    .idle-icon { font-size:2.2rem; opacity:.3; margin-bottom:10px; }
    .idle-text { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--dim); line-height:1.8; }

    /* Buttons */
    .btn-primary { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-family:'Syne',sans-serif; font-size:.92rem; font-weight:700; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:8px; flex-shrink:0; box-shadow:0 2px 6px rgba(2,132,199,.25); }
    .btn-primary:hover { background:#0369a1; box-shadow:0 4px 12px rgba(2,132,199,.3); }
    .btn-primary:disabled { background:var(--dim); box-shadow:none; cursor:not-allowed; }
    .btn-ghost { width:100%; padding:10px; background:transparent; color:var(--muted); border:1.5px solid var(--border); border-radius:10px; font-family:'IBM Plex Sans',sans-serif; font-size:.82rem; cursor:pointer; transition:all .15s; flex-shrink:0; }
    .btn-ghost:hover { border-color:var(--accent-b); color:var(--accent); background:var(--accent-dim); }
    .error-box { background:rgba(220,38,38,.06); border:1px solid rgba(220,38,38,.25); border-radius:8px; padding:10px 14px; font-size:.78rem; color:var(--danger); flex-shrink:0; }
    .spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; flex-shrink:0; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const API = "http://127.0.0.1:8000";

    const BEHAVIORS = [
      { field: "calm",               label: "😌 Calm"               },
      { field: "agitated",           label: "😤 Agitated"           },
      { field: "short_attention",    label: "🧠 Short Attention"    },
      { field: "anxious",            label: "😰 Anxious"            },
      { field: "extremely_agitated", label: "🤯 Extremely Agitated" },
      { field: "uncooperative",      label: "🙅 Uncooperative"      },
    ];

    const ICDAS_LABELS = ["Sound","Very early","Early enamel","Mid enamel","Deep enamel","Dentin involvement","Extensive dentin"];
    const ASA_LABELS   = ["","Healthy","Mild systemic","Severe systemic","Life-threatening"];

    const genId = () => "PT-" + Math.random().toString(36).slice(2, 7).toUpperCase();
    const blank = () => ({
      patient_id: genId(), patient_name: "",
      age: "", asa: "", icdas_max: "", nombre_de_dents_severes: "",
      presence_of_infection: null, previous_failed_dental_attempts: null,
      special_needs: null, previous_general_anesthesia: null,
      calm: 0, agitated: 0, short_attention: 0,
      anxious: 0, extremely_agitated: 0, uncooperative: 0,
    });

    function PatientProfile({ selected }) {
      if (!selected) return null;
      const visits = [...selected.visits].reverse();
      const behaviors = ["calm","agitated","short_attention","anxious","extremely_agitated","uncooperative"];
      const behaviorLabels = {
        calm:"Calm", agitated:"Agitated", short_attention:"Short Att.",
        anxious:"Anxious", extremely_agitated:"Ext. Agitated", uncooperative:"Uncooperative"
      };
      return (
        <div className="profile-box">
          <div className="profile-header">
            <div>
              <div className="profile-pid">{selected.patient_id}</div>
              <div className="profile-name">{selected.patient_name || "Unknown Patient"}</div>
            </div>
            <span className="profile-badge">{selected.visits.length} visit{selected.visits.length !== 1 ? "s" : ""}</span>
          </div>
          <div className="profile-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Date</th><th>Age</th><th>ASA</th><th>ICDAS</th>
                  <th>Teeth</th><th>Infect.</th><th>Prev.Fail</th>
                  <th>Sp.Needs</th><th>Prev.GA</th>
                  <th>Behaviour</th><th>Decision</th><th>Conf.</th>
                </tr>
              </thead>
              <tbody>
                {visits.map((v, i) => {
                  const isGA = v.decision === 1;
                  const conf = Math.round(Math.max(v.probability_ga, v.probability_no_ga) * 100);
                  const inp  = v.inputs || {};
                  const behs = behaviors.filter(b => inp[b] === 1);
                  const visitN = selected.visits.length - i;
                  return (
                    <tr key={i}>
                      <td style={{color:"var(--muted)",fontFamily:"monospace"}}>{visitN}</td>
                      <td className="td-date">{v.timestamp.slice(0,10)}</td>
                      <td>{inp.age ?? "—"}</td>
                      <td>{inp.asa ? `${inp.asa}` : "—"}</td>
                      <td>{inp.icdas_max !== undefined ? `${inp.icdas_max}` : "—"}</td>
                      <td>{inp.nombre_de_dents_severes ?? "—"}</td>
                      <td><span className={`tag ${inp.presence_of_infection ? "yes" : "no"}`}>{inp.presence_of_infection ? "Yes" : "No"}</span></td>
                      <td><span className={`tag ${inp.previous_failed_dental_attempts ? "yes" : "no"}`}>{inp.previous_failed_dental_attempts ? "Yes" : "No"}</span></td>
                      <td><span className={`tag ${inp.special_needs ? "yes" : "no"}`}>{inp.special_needs ? "Yes" : "No"}</span></td>
                      <td><span className={`tag ${inp.previous_general_anesthesia ? "yes" : "no"}`}>{inp.previous_general_anesthesia ? "Yes" : "No"}</span></td>
                      <td>{behs.length === 0 ? <span style={{color:"var(--dim)"}}>None</span> : behs.map(b => <span key={b} className="tag beh">{behaviorLabels[b]}</span>)}</td>
                      <td className={`td-decision ${isGA ? "ga" : "ok"}`}>{isGA ? "🔴 GA Req." : "🟢 No GA"}</td>
                      <td className="td-conf">{conf}%</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function App() {
      const [form,     setForm]     = useState(blank());
      const [loading,  setLoading]  = useState(false);
      const [result,   setResult]   = useState(null);
      const [error,    setError]    = useState("");
      const [patients, setPatients] = useState([]);
      const [search,   setSearch]   = useState("");
      const [selected, setSelected] = useState(null);
      const [activeId, setActiveId] = useState(null);

      const fetchPatients = useCallback(async () => {
        try { const r = await fetch(`${API}/patients`); if (r.ok) setPatients(await r.json()); } catch {}
      }, []);

      useEffect(() => { fetchPatients(); }, [fetchPatients]);

      const set    = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const togB   = field  => setForm(f => ({ ...f, [field]: f[field] ? 0 : 1 }));
      const togBin = (field, val) => setForm(f => ({ ...f, [field]: f[field] === val ? null : val }));

      const validate = () => {
        const m = [];
        if (!form.patient_id.trim())                        m.push("Patient ID");
        if (!form.age)                                      m.push("Age");
        if (!form.asa)                                      m.push("ASA");
        if (form.icdas_max === "")                          m.push("ICDAS Score");
        if (form.nombre_de_dents_severes === "")            m.push("Affected Teeth");
        if (form.presence_of_infection === null)            m.push("Infection status");
        if (form.previous_failed_dental_attempts === null)  m.push("Failed Attempts");
        if (form.special_needs === null)                    m.push("Special Needs");
        if (form.previous_general_anesthesia === null)      m.push("Previous GA");
        return m;
      };

      const handleSubmit = async () => {
        setError("");
        const missing = validate();
        if (missing.length) { setError("Please fill in: " + missing.join(", ")); return; }
        setLoading(true); setResult(null);
        try {
          const res = await fetch(`${API}/predict`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              patient_id:                      form.patient_id.trim(),
              patient_name:                    form.patient_name.trim() || null,
              age:                             parseFloat(form.age),
              asa:                             parseInt(form.asa),
              icdas_max:                       parseInt(form.icdas_max),
              nombre_de_dents_severes:         parseInt(form.nombre_de_dents_severes),
              calm:                            form.calm,
              agitated:                        form.agitated,
              short_attention:                 form.short_attention,
              anxious:                         form.anxious,
              extremely_agitated:              form.extremely_agitated,
              uncooperative:                   form.uncooperative,
              special_needs:                   form.special_needs,
              previous_general_anesthesia:     form.previous_general_anesthesia,
              presence_of_infection:           form.presence_of_infection,
              previous_failed_dental_attempts: form.previous_failed_dental_attempts,
            }),
          });
          if (!res.ok) { const e = await res.json(); throw new Error(e.detail || "Server error"); }
          const data = await res.json();
          setResult(data);
          setActiveId(data.patient_id);
          await fetchPatients();
          const det = await fetch(`${API}/patients/${data.patient_id}`);
          if (det.ok) setSelected(await det.json());
        } catch (e) {
          setError(e.message.includes("fetch")
            ? "Cannot reach backend. Try again in 30 seconds (server may be waking up)."
            : e.message);
        } finally { setLoading(false); }
      };

      const handleSelectPatient = async (pid) => {
        setActiveId(pid); setResult(null); setError("");
        try {
          const r = await fetch(`${API}/patients/${pid}`);
          if (r.ok) {
            const data = await r.json();
            setSelected(data);
            if (data.visits && data.visits.length > 0) {
              const last = data.visits[data.visits.length - 1].inputs;
              setForm({
                patient_id:                      data.patient_id,
                patient_name:                    data.patient_name || "",
                age:                             last.age ?? "",
                asa:                             last.asa ?? "",
                icdas_max:                       last.icdas_max ?? "",
                nombre_de_dents_severes:         last.nombre_de_dents_severes ?? "",
                presence_of_infection:           last.presence_of_infection ?? null,
                previous_failed_dental_attempts: last.previous_failed_dental_attempts ?? null,
                special_needs:                   last.special_needs ?? null,
                previous_general_anesthesia:     last.previous_general_anesthesia ?? null,
                calm:                            last.calm ?? 0,
                agitated:                        last.agitated ?? 0,
                short_attention:                 last.short_attention ?? 0,
                anxious:                         last.anxious ?? 0,
                extremely_agitated:              last.extremely_agitated ?? 0,
                uncooperative:                   last.uncooperative ?? 0,
              });
            }
          }
        } catch {}
      };

      const handleReset = () => {
        setForm(blank()); setResult(null); setError(""); setActiveId(null); setSelected(null);
      };

      const filtered = patients.filter(p =>
        p.patient_id.includes(search.toUpperCase()) ||
        (p.patient_name || "").toLowerCase().includes(search.toLowerCase())
      );

      const pGA = result ? Math.round(result.probability_ga    * 100) : 0;
      const pNo = result ? Math.round(result.probability_no_ga * 100) : 0;

      return (
        <>
          <header className="hdr">
            <div className="hdr-brand">
              <div className="hdr-logo">GA</div>
              <span className="hdr-name">AnesthAssist</span>
            </div>
            <span className="hdr-badge">DENTAL · DECISION SUPPORT v3</span>
          </header>

          <div className="layout">

            {/* LEFT */}
            <aside className="col-history">
              <div className="hist-head">
                <div className="hist-head-title">Patient Memory</div>
                <div className="hist-head-sub">{patients.length} patient{patients.length !== 1 ? "s" : ""} stored</div>
                <div className="hist-search">
                  <input placeholder="Search ID or name…" value={search} onChange={e => setSearch(e.target.value)} />
                </div>
              </div>
              <div className="hist-list">
                {filtered.length === 0
                  ? <div className="hist-empty">No patients yet.<br />Run an assessment<br />to save one.</div>
                  : filtered.map(p => (
                    <div key={p.patient_id}
                      className={`hist-item ${activeId === p.patient_id ? "active" : ""}`}
                      onClick={() => handleSelectPatient(p.patient_id)}>
                      <div className="hist-pid">{p.patient_id}</div>
                      {p.patient_name && <div className="hist-pname">{p.patient_name}</div>}
                      <div className="hist-row">
                        <span className="hist-vis">{p.visit_count} visit{p.visit_count !== 1 ? "s" : ""}</span>
                        <span className={`dot ${p.last_decision === 1 ? "ga" : "ok"}`} />
                      </div>
                    </div>
                  ))}
              </div>
            </aside>

            {/* CENTER */}
            <main className="col-form">

              <div className="slabel">00 · Patient Identity</div>
              <div className="card">
                <div className="form-grid">
                  <div className="field">
                    <label>Patient ID</label>
                    <div className="pid-row">
                      <input type="text" placeholder="e.g. PT-00123"
                        value={form.patient_id}
                        onChange={e => set("patient_id", e.target.value.toUpperCase())} />
                      <button className="btn-gen" onClick={() => set("patient_id", genId())}>⟳ Gen</button>
                    </div>
                  </div>
                  <div className="field">
                    <label>Patient Name (optional)</label>
                    <input type="text" placeholder="e.g. Ali Hassan"
                      value={form.patient_name} onChange={e => set("patient_name", e.target.value)} />
                  </div>
                </div>
              </div>

              <div className="slabel">01 · Clinical Data</div>
              <div className="card">
                <div className="form-grid">
                  <div className="field">
                    <label>Age (years)</label>
                    <input type="number" min="0" max="120" placeholder="e.g. 8"
                      value={form.age} onChange={e => set("age", e.target.value)} />
                  </div>
                  <div className="field">
                    <label>ASA Classification</label>
                    <select value={form.asa} onChange={e => set("asa", e.target.value)}>
                      <option value="">Select…</option>
                      <option value="1">I — Healthy</option>
                      <option value="2">II — Mild systemic disease</option>
                      <option value="3">III — Severe systemic disease</option>
                      <option value="4">IV — Life-threatening disease</option>
                    </select>
                  </div>
                  <div className="field">
                    <label>Max ICDAS Score</label>
                    <select value={form.icdas_max} onChange={e => set("icdas_max", e.target.value)}>
                      <option value="">Select…</option>
                      {ICDAS_LABELS.map((lbl, i) => <option key={i} value={i}>{i} — {lbl}</option>)}
                    </select>
                  </div>
                  <div className="field">
                    <label>Severely Affected Teeth</label>
                    <input type="number" min="0" max="32" placeholder="e.g. 4"
                      value={form.nombre_de_dents_severes}
                      onChange={e => set("nombre_de_dents_severes", e.target.value)} />
                  </div>
                  <div className="field">
                    <label>Presence of Infection</label>
                    <div className="chip-grid">
                      {[{v:0,l:"No"},{v:1,l:"Yes"}].map(o => (
                        <div key={o.v}
                          className={`chip ${form.presence_of_infection === o.v ? (o.v===1?"on-yes":"on") : ""}`}
                          onClick={() => togBin("presence_of_infection", o.v)}>{o.l}</div>
                      ))}
                    </div>
                  </div>
                  <div className="field">
                    <label>Previous Failed Attempts</label>
                    <div className="chip-grid">
                      {[{v:0,l:"No"},{v:1,l:"Yes"}].map(o => (
                        <div key={o.v}
                          className={`chip ${form.previous_failed_dental_attempts === o.v ? (o.v===1?"on-yes":"on") : ""}`}
                          onClick={() => togBin("previous_failed_dental_attempts", o.v)}>{o.l}</div>
                      ))}
                    </div>
                  </div>
                  <div className="field">
                    <label>Special Needs</label>
                    <div className="chip-grid">
                      {[{v:0,l:"No"},{v:1,l:"Yes"}].map(o => (
                        <div key={o.v}
                          className={`chip ${form.special_needs === o.v ? (o.v===1?"on-yes":"on") : ""}`}
                          onClick={() => togBin("special_needs", o.v)}>{o.l}</div>
                      ))}
                    </div>
                  </div>
                  <div className="field">
                    <label>Previous General Anesthesia</label>
                    <div className="chip-grid">
                      {[{v:0,l:"No"},{v:1,l:"Yes"}].map(o => (
                        <div key={o.v}
                          className={`chip ${form.previous_general_anesthesia === o.v ? (o.v===1?"on-yes":"on") : ""}`}
                          onClick={() => togBin("previous_general_anesthesia", o.v)}>{o.l}</div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              <div className="slabel">02 · Behavioural Profile</div>
              <div className="card">
                <div className="chip-grid">
                  {BEHAVIORS.map(({ field, label }) => (
                    <div key={field} className={`chip ${form[field] ? "on" : ""}`}
                      onClick={() => togB(field)}>{label}</div>
                  ))}
                </div>
              </div>

            </main>

            {/* RIGHT */}
            <aside className="col-result">
              <div className="warn-box">
                <strong>⚠ Clinical Use Only.</strong> This tool supports — but does not replace — clinical judgment.
              </div>

              {result ? (
                <div className={`result-card ${result.decision === 1 ? "ga" : "no-ga"}`}>
                  <div className="r-icon">{result.decision === 1 ? "🔴" : "🟢"}</div>
                  <div className="r-verdict">{result.label}</div>
                  <div className="r-meta">
                    {result.patient_id}{result.patient_name ? ` · ${result.patient_name}` : ""}<br />
                    Visit #{result.visit_count} · {result.timestamp.replace("T"," ")}
                  </div>
                  <div className="prob-row">
                    <div className="prob-item">
                      <div className="prob-top">
                        <span className="prob-name">GA Required</span>
                        <span className="prob-pct ga">{pGA}%</span>
                      </div>
                      <div className="bar-track"><div className="bar-fill ga-bar" style={{width:`${pGA}%`}} /></div>
                    </div>
                    <div className="prob-item">
                      <div className="prob-top">
                        <span className="prob-name">GA Not Required</span>
                        <span className="prob-pct ok">{pNo}%</span>
                      </div>
                      <div className="bar-track"><div className="bar-fill ok-bar" style={{width:`${pNo}%`}} /></div>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="idle-box">
                  <div className="idle-icon">🦷</div>
                  <div className="idle-text">Fill the form<br />and assess the patient</div>
                </div>
              )}

              <PatientProfile selected={selected} />

              {error && <div className="error-box">⚠ {error}</div>}

              <button className="btn-primary" onClick={handleSubmit} disabled={loading}>
                {loading ? <><span className="spinner" /> Assessing…</> : "Assess Patient"}
              </button>
              <button className="btn-ghost" onClick={handleReset}>New Patient</button>
            </aside>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
